<!DOCTYPE html>
<html lang="en" ng-app="tripAdvisorApp">
<head>
    <meta charset="UTF-8">
    <title>TripAdvisor Clone (AngularJS)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text-main);
        }
        header { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 20px 40px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-left { display: flex; align-items: center; gap: 30px; }
        header h1 { font-size: 1.8rem; margin: 0; font-weight: 700; color: var(--primary); letter-spacing: -0.5px;}
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 1rem; transition: color 0.2s;}
        nav a:hover { color: var(--primary); }
        .auth-section { display: flex; align-items: center; }
        .btn-primary { padding: 10px 20px; border-radius: 8px; cursor: pointer; background: var(--primary); color: white; border: none; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { padding: 8px 16px; border-radius: 8px; cursor: pointer; background: #fff; color: var(--text-main); border: 1px solid #e2e8f0; font-weight: 600; transition: all 0.2s; }
        .btn-secondary:hover { background: #f1f5f9; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .location-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px;}
        .location-card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.04); padding: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; display: flex; flex-direction: column;}
        .location-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .card-image-wrapper { height: 220px; overflow: hidden; position: relative; }
        .location-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;}
        .location-card:hover img { transform: scale(1.05); }
        .location-card-content { padding: 24px; flex-grow: 1; display: flex; flex-direction: column;}
        .location-card h3 { color: var(--text-main); margin: 0 0 10px 0; font-size: 1.4rem; font-weight: 700; line-height: 1.2;}
        .location-card p { color: var(--text-muted); margin: 0 0 20px 0; font-size: 0.95rem; line-height: 1.5; flex-grow: 1;}
        .stars { font-size: 1.4rem; margin-bottom: 12px; display: flex; align-items: center; gap: 2px;}
        .star { cursor: pointer; transition: transform 0.15s; color: #fbbf24;}
        .star:hover { transform: scale(1.2);}
        .rating-count { color: var(--text-muted); font-size: 0.9rem; margin-left: 8px; font-weight: 500;}
        
        .reviews { margin-top: auto; border-top: 1px solid #f1f5f9; padding-top: 16px;}
        .reviews ul { padding: 0; margin: 0; list-style: none;}
        .reviews li { color: var(--text-main); font-size: 0.9rem; background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #f1f5f9;}
        .review-form { display: flex; gap: 8px; margin-top: 12px;}
        .review-form input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; font-family: 'Inter', sans-serif; font-size: 0.9rem; transition: border-color 0.2s;}
        .review-form input:focus { outline: none; border-color: var(--primary); }
        .review-form button { background: var(--text-main); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s;}
        .review-form button:hover { background: #334155;}
        
        .add-btn { position: fixed; bottom: 40px; right: 40px; background: var(--primary); color: #fff; border: none; border-radius: 50%; width: 64px; height: 64px; font-size: 2rem; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); cursor: pointer; z-index: 10; transition: all 0.2s; display: flex; align-items: center; justify-content: center;}
        .add-btn:hover { background: var(--primary-hover); transform: scale(1.05);}
        
        /* Modal styles */
        .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s;}
        .modal { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 100%; max-width: 450px; position: relative;}
        .modal h2 { margin-top: 0; color: var(--text-main); font-size: 1.8rem; margin-bottom: 24px;}
        .modal form { display: flex; flex-direction: column; gap: 16px;}
        .modal input { padding: 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif; font-size: 1rem; transition: border-color 0.2s;}
        .modal input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);}
        .modal button { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: background 0.2s; margin-top: 8px;}
        .modal button:hover { background: var(--primary-hover);}
        .close-modal { position: absolute; top: 20px; right: 24px; font-size: 2rem; color: #94a3b8; cursor: pointer; transition: color 0.2s; line-height: 1;}
        .close-modal:hover { color: var(--text-main);}
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 16px; padding: 20px;}
            .header-left { flex-direction: column; gap: 12px; }
            .add-btn { right: 20px; bottom: 20px;}
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- THEN your app.js -->
    <script src="app.js"></script>
</head>
<body>
    <header ng-controller="AuthController">
        <div class="header-left">
            <h1>TripAdvisor</h1>
            <nav>
                <a href="#!/listings">Listings</a>
                <a href="#!/about" style="margin-left: 20px;">About</a>
            </nav>
        </div>
        <div class="auth-section">
            <span ng-if="user" style="margin-right: 15px; font-weight: 500;">{{user.displayName}}</span>
            <button ng-if="user" ng-click="logout()" class="btn-secondary">Sign Out</button>
        </div>
    </header>
    <div class="container">
        <div ng-view></div>
    </div>
</body>
</html>
