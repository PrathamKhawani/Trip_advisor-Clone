<h2>Travel Listings</h2>

<input type="text" ng-model="searchQuery" placeholder="Search by name or city..." style="width: 300px; padding: 10px;">

<div ng-show="loading">Loading listings...</div>
<div ng-show="error" style="color: red;">{{ error }}</div>

<div class="location-item" ng-repeat="location in locations | filter: locationFilter">
    <h3>{{ location.name }} ({{ location.city }})</h3>
    <p>
        Type: {{ location.type }} |
        Rating: {{ location.avg_rating }} / 5.0
    </p>
    <p>{{ location.description }}</p>
</div>

<div ng-if="!loading && !error && (locations | filter: locationFilter).length === 0">
    No results found for "{{ searchQuery }}".
</div>
